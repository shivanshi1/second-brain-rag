[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secondbrain"
version = "0.1.0"
description = "Second Brain RAG: ask questions across your own notes, PDFs and articles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "typer>=0.12",
  "python-frontmatter>=1.1",
  "pymupdf4llm>=0.0.17",
  "trafilatura>=1.12",
]

[project.optional-dependencies]
# Heavy ML deps are optional so CI and quick API work stay light.
ml = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.37"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
secondbrain = "secondbrain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/secondbrain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query",
  "typer.Argument", "typer.Option",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
